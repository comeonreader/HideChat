services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hidechat
      POSTGRES_USER: hidechat
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请先执行 cp docker/.env.example .env 并填写}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hidechat"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hidechat
      SPRING_DATASOURCE_USERNAME: hidechat
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?请先执行 cp docker/.env.example .env 并填写}
      JWT_SECRET: ${JWT_SECRET:?请先执行 cp docker/.env.example .env 并填写}
      UPLOAD_DIR: /data/uploads
      AVATAR_DIR: /data/avatars
      MSG_TTL_MINUTES: ${MSG_TTL_MINUTES:-20}
      RECALL_WINDOW_MINUTES: ${RECALL_WINDOW_MINUTES:-2}
      UNREAD_MAX_DAYS: ${UNREAD_MAX_DAYS:-30}
    volumes:
      - uploads:/data/uploads
      - avatars:/data/avatars
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  avatars:
